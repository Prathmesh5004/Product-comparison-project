<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Product Comparison Dashboard</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <div class="app">

    <!-- Header -->
    <header class="header">
      <div class="header-content">

        <div>
          <h1>Product Comparison Dashboard</h1>

          <p class="subtitle">
            Compare products, prices, ratings and specifications
          </p>
        </div>

        <div class="api-status">
          <span id="statusDot" class="status-dot"></span>
          <span id="apiStatus">Connecting to API...</span>
        </div>

      </div>
    </header>


    <main>

      <!-- Dashboard Stats -->
      <section class="stats">

        <div class="stat-card">
          <span class="stat-label">Total Products</span>
          <strong id="totalProducts" class="stat-value">—</strong>
        </div>

        <div class="stat-card">
          <span class="stat-label">Lowest Price</span>
          <strong id="lowestPrice" class="stat-value">—</strong>
        </div>

        <div class="stat-card">
          <span class="stat-label">Highest Rating</span>
          <strong id="highestRating" class="stat-value">—</strong>
        </div>

        <div class="stat-card">
          <span class="stat-label">Average Price</span>
          <strong id="averagePrice" class="stat-value">—</strong>
        </div>

      </section>


      <!-- Controls -->
      <section class="controls">

        <div class="search">
          <input
            type="text"
            id="searchInput"
            placeholder="Search products..."
          />
        </div>

        <select id="sortSelect">
          <option value="default">Sort by</option>
          <option value="price-low">Price: Low → High</option>
          <option value="price-high">Price: High → Low</option>
          <option value="rating-high">Rating: High → Low</option>
          <option value="name">Name A → Z</option>
        </select>

        <button
          id="refreshBtn"
          class="refresh-btn"
        >
          ↻ Refresh
        </button>

      </section>


      <!-- Comparison Table -->
      <section class="comparison-card">

        <div class="card-header">

          <h2>Product Comparison</h2>

          <span
            id="productCount"
            class="product-count"
          >
            0 products
          </span>

        </div>


        <div class="table-wrapper">

          <div id="content">
            <div class="loading">
              <div class="loader"></div>
              Loading products...
            </div>
          </div>

        </div>

      </section>

    </main>

  </div>


  <script src="script.js"></script>

</body>
</html>
